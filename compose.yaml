services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: taskflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d taskflow"]
      interval: 2s
      timeout: 3s
      retries: 20
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro

  test:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/taskflow_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/taskflow_test
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-development-only-secret-change-before-production}
    depends_on:
      db:
        condition: service_healthy
    command: >-
      sh -c "alembic upgrade head && python -m pytest -q"

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/taskflow
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-development-only-secret-change-before-production}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
    depends_on:
      db:
        condition: service_healthy
      test:
        condition: service_completed_successfully
    command: >-
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"

volumes:
  postgres_data: